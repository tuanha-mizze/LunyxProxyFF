
name: Build Lunyx Proxy IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project LunyxProxy.xcodeproj \
            -scheme LunyxProxy \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LunyxProxy.app Payload/
          zip -r LunyxProxy.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LunyxProxy-IPA
          path: LunyxProxy.ipa
