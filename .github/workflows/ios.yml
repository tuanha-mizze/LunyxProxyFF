
name: Build Lunyx Proxy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Xcode
        run: xcodebuild -version

      - name: Check project files
        run: |
          echo "Lunyx Proxy repository"
          find . -maxdepth 4 -type f
