
name: LunyxProxy

options:
  bundleIdPrefix: com.lunyx
  deploymentTarget:
    iOS: "16.0"

targets:
  LunyxProxy:
    type: application
    platform: iOS
    sources:
      - path: ContentView.swift
      - path: LunyxProxyApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lunyx.proxy
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
